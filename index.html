<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #121620;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container Mockup HP */
        .phone-frame {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 870px;
            background-color: #0d1117;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
        }

        @media (min-width: 480px) {
            .phone-frame {
                border-radius: 40px;
                border: 10px solid #2b2b2b;
                height: 844px;
            }
        }

        /* Background Ilustrasi Kamar Estetik Malam Hari */
        .bg-room {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Menggunakan gambar ilustrasi sebagai latar belakang */
            background-image: url('https://i.ibb.co.id/27046/1000232196.jpg'); /* Sesuaikan path/URL gambar jika perlu */
            background-size: cover;
            background-position: center;
        }

        /* Overlay Gradasi agar elemen UI lebih terbaca */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(13, 17, 23, 0.3) 0%, rgba(13, 17, 23, 0.1) 50%, rgba(13, 17, 23, 0.7) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Header Status Bar & Navigasi Atas */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }

        .home-icon {
            font-size: 18px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Konten Utama di Tengah */
        .main-content {
            text-align: center;
            margin-top: 40px;
        }

        .greeting-text {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }

        .sub-greeting {
            color: #f0f0f0;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Tombol Interaktif Buka Hadiah */
        .gift-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 35, 45, 0.7);
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .gift-btn:hover {
            background: rgba(50, 58, 75, 0.9);
            transform: scale(1.05);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(18, 22, 32, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            border-radius: 24px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #d1b894;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-item img {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .nav-item.active {
            color: #fff;
        }

        .profile-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #d1b894;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Background Gambar -->
        <div class="bg-room"></div>

        <!-- Lapisan UI & Konten -->
        <div class="overlay">
            <!-- Header Atas -->
            <div class="header">
                <div class="home-icon">🏠</div>
                <div>1/7</div>
            </div>

            <!-- Konten Teks & Tombol -->
            <div class="main-content">
                <div class="greeting-text">Hei kamu...</div>
                <div class="sub-greeting">Ada sesuatu buat kamu ♡</div>
                <a href="#" class="gift-btn" onclick="alert('Hadiah dibuka!')">
                    Buka Hadiah <span>→</span>
                </a>
            </div>

            <!-- Menu Navigasi Bawah -->
            <div class="bottom-nav">
                <a href="#" class="nav-item">
                    <!-- Icon Buku SVG/Emoji Sederhana -->
                    <span style="font-size: 20px;">📖</span>
                    Books
                </a>
                <a href="#" class="nav-item">
                    <span style="font-size: 20px;">💬</span>
                    Chat
                </a>
                <a href="#" class="nav-item">
                    <span style="font-size: 20px;">⚙️</span>
                    Settings
                </a>
                <a href="#" class="nav-item active">
                    <img src="https://i.ibb.co.id/27046/1000232196.jpg" alt="Profile" class="profile-avatar">
                    Profile
                </a>
            </div>
        </div>
    </div>

</body>
</html>
